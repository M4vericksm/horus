services:
  backend:
    build: .
    container_name: networkatlas_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    env_file: .env
    # Sem bloco environment: — todas as variáveis vêm do .env

  db:
    image: postgres:15
    container_name: networkatlas_db
    restart: always
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Bind só em loopback: o backend acessa via rede interna do compose (db:5432);
      # expor 0.0.0.0:5432 deixava o Postgres acessível a qualquer host da rede.
      - "127.0.0.1:15432:5432"
      # Para dev local com Postgres nativo na 5432, use:
      # - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 10s

  frontend:
    image: nginx:stable
    container_name: networkatlas_frontend
    restart: always
    env_file: .env
    volumes:
      - ./front:/usr/share/nginx/html
    ports:
      - "80:80"
    entrypoint: ["/bin/sh", "-c", "echo \"window.API_PORT='$${API_PORT:-8000}';\">  /usr/share/nginx/html/config.js && exec nginx -g 'daemon off;'"]

volumes:
  postgres_data:
    name: networkatlas_postgres_data
